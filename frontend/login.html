<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIA — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-deep: #0e1116;
            --bg-card: #151a21;
            --bg-input: #1b212a;
            --accent: #d9974a;
            --accent-ink: #1b1206;
            --accent-glow: rgba(217, 151, 74, 0.16);
            --text: #e8eaed;
            --text-dim: #94a0ad;
            --text-faint: #616c78;
            --border: rgba(255, 255, 255, 0.09);
            --border-strong: rgba(255, 255, 255, 0.17);
            --danger: #e2604f;
            --danger-soft: rgba(226, 96, 79, 0.12);
            --radius: 14px;
            --font-sans: 'IBM Plex Sans', -apple-system, sans-serif;
            --font-display: 'IBM Plex Sans Condensed', sans-serif;
            --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
        }

        body {
            font-family: var(--font-sans);
            background:
                radial-gradient(560px 420px at 50% -8%, rgba(217, 151, 74, 0.10), transparent 70%),
                var(--bg-deep);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }

        .login-container {
            width: 100%;
            max-width: 380px;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px 34px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            animation: rise 0.4s ease-out;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-icon {
            width: 46px;
            height: 46px;
            background: var(--accent);
            color: var(--accent-ink);
            border-radius: 11px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 21px;
            margin-bottom: 16px;
        }
        .logo h1 {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text);
        }
        .logo p {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-faint);
            margin-top: 6px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-family: var(--font-mono);
            font-size: 10.5px;
            font-weight: 500;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 8px;
        }
        .input-wrapper {
            position: relative;
        }
        .form-group input {
            width: 100%;
            padding: 12px 44px 12px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s, background-color 0.15s;
        }
        .form-group input:focus {
            border-color: var(--accent);
            background: var(--bg-card);
        }
        .form-group input::placeholder {
            color: var(--text-faint);
        }
        .toggle-password {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            background: none;
            border: none;
            color: var(--text-faint);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: color 0.15s, background-color 0.15s;
        }
        .toggle-password:hover { color: var(--text); background: rgba(255,255,255,0.05); }
        .toggle-password svg { width: 17px; height: 17px; }
        .toggle-password .eye-off { display: none; }
        .toggle-password.showing .eye { display: none; }
        .toggle-password.showing .eye-off { display: block; }

        /* Button */
        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 9px;
            color: var(--accent-ink);
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: filter 0.15s;
            position: relative;
        }
        .login-btn:hover { filter: brightness(1.08); }
        .login-btn:active { filter: brightness(0.95); }
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .login-btn .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(27, 18, 6, 0.3);
            border-top-color: var(--accent-ink);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }
        .login-btn.loading .btn-text { display: none; }
        .login-btn.loading .spinner { display: block; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Error message */
        .error-msg {
            background: var(--danger-soft);
            border: 1px solid rgba(226, 96, 79, 0.25);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--danger);
            font-size: 12.5px;
            margin-bottom: 18px;
            display: none;
        }
        .error-msg.shake { animation: shake 0.3s ease; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 22px;
            font-family: var(--font-mono);
            font-size: 10.5px;
            color: var(--text-faint);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @media (prefers-reduced-motion: reduce) {
            .login-card { animation: none; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <div class="logo-icon">M</div>
                <h1>MIA</h1>
                <p>Multi-model Interactive Agentic-system</p>
            </div>

            <div class="error-msg" id="errorMsg"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="toggle-password" onclick="togglePassword()" title="Show password">
                            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 4.2-5.6M9.9 4.2A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a20.5 20.5 0 0 1-2.6 3.9M14.1 14.1a3 3 0 1 1-4.2-4.2M1 1l22 22"/></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="btn-text">Access MIA</span>
                    <div class="spinner"></div>
                </button>
            </form>

            <div class="footer">Encrypted connection · Single user</div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const btn = document.querySelector('.toggle-password');
            const showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            btn.classList.toggle('showing', !showing);
            btn.title = showing ? 'Show password' : 'Hide password';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const password = document.getElementById('password').value;

            btn.classList.add('loading');
            btn.disabled = true;
            errorMsg.style.display = 'none';
            errorMsg.classList.remove('shake');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('mia_token', data.token);
                    window.location.href = '/';
                } else {
                    errorMsg.textContent = data.message || 'Invalid password';
                    errorMsg.style.display = 'block';
                    errorMsg.classList.add('shake');
                }
            } catch (err) {
                errorMsg.textContent = 'Connection error. Is the server running?';
                errorMsg.style.display = 'block';
                errorMsg.classList.add('shake');
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // Check if already authenticated
        (async () => {
            try {
                const token = localStorage.getItem('mia_token');
                if (token) {
                    const res = await fetch('/api/auth/session', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await res.json();
                    if (data.authenticated) window.location.href = '/';
                }
            } catch (e) {}
        })();
    </script>
</body>
</html>
